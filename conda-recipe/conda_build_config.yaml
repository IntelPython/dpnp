# Python versions for ci/matrix.py, one per line, without selectors
python:
    - "3.11.* *_cpython"
    - "3.12.* *_cpython"
    - "3.13.* *_cp313"
    - "3.14.* *_cp314"
    - "3.14.* *_cp314t"
    - "3.15.* *_cp315"
    # TODO: add "3.15.* *_cp315t" once dpctl's dev conda packages and conda-forge's scipy have cp315t: https://github.com/IntelPython/dpctl/pull/2409
numpy:
    - '2'
c_compiler:                   # [linux]
    - gcc                     # [linux]
cxx_compiler:                 # [linux]
    - gxx                     # [linux]
cxx_compiler_version:         # [linux]
    - '15'                    # [linux]
c_stdlib:                     # [linux]
    - sysroot                 # [linux]
c_stdlib_version:             # [linux]
    - '2.28'                  # [linux]
c_stdlib:                     # [win]
    - vs                      # [win]
cxx_compiler:                 # [win]
    - vs2022                  # [win]
c_compiler:                   # [win]
    - vs2022                  # [win]

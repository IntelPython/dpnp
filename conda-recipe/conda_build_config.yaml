# Python versions for ci/matrix.py, one per line, without selectors
python:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14.* *_cp314"
    - "3.14.* *_cp314t"
    - "3.15.* *_cp315"
numpy:
    - '2'
c_compiler:                   # [linux]
    - gcc                     # [linux]
cxx_compiler:                 # [linux]
    - gxx                     # [linux]
cxx_compiler_version:         # [linux]
    - '15'                    # [linux]
c_stdlib:                     # [linux]
    - sysroot                 # [linux]
c_stdlib_version:             # [linux]
    - '2.28'                  # [linux]
c_stdlib:                     # [win]
    - vs                      # [win]
cxx_compiler:                 # [win]
    - vs2022                  # [win]
c_compiler:                   # [win]
    - vs2022                  # [win]

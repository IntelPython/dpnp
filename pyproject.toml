[build-system]
build-backend = "setuptools.build_meta"
requires = [
  # TODO: keep in sync with [project.dependencies]
  "build>=1.2.2",
  "cmake>=3.31.6",
  "cython>=3.1.0",
  # WARNING: use only dpctl version available on PyPi
  "dpctl>=0.20.0",
  "ninja>=1.11.1; platform_system!='Windows'",
  # NOTE: no DPNP restriction on NumPy version, so follow NumPy's drop schedule
  "numpy>=1.26.0",
  "scikit-build>=0.18.1",
  "setuptools>=79.0.1",
  "wheel>=0.45.1",
  # WARNING: check with doc how to upgrade
  "versioneer[toml]==0.29"
]

[project]
authors = [{ name = "Intel Corporation" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: C++",
  "Programming Language :: Cython",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  # No 3.15: dpctl has no cp315 wheel yet, which the wheels build against
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX",
  "Operating System :: Unix"
]
dependencies = [
  # TODO: keep in sync with [build-system.requires] and conda-recipe/meta.yaml
  # This restrictions are for dependabot, actual restrictions are set with
  # conda.
  # TODO: populate it during build process
  # TODO: do we have to set sycl runtime dependencies here
  # "dpcpp-cpp-rt>=0.59.0",
  # "intel-cmplr-lib-rt>=0.59.0"
  # WARNING: use the latest dpctl dev version, otherwise stable w/f will fail
  "dpctl>=0.23.0dev0",
  "numpy>=1.26.0"
]
description = "Data Parallel Extension for NumPy"
dynamic = ["version"]
keywords = [
  "dpnp",
  "sycl",
  "numpy",
  "python3",
  "intel",
  "mkl",
  "oneapi",
  "gpu",
  "dpcpp"
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
maintainers = [{ name = "Intel Corporation" }]
name = "dpnp"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.16"

[project.optional-dependencies]
benchmark = ["asv>=0.6", "scipy"]
coverage = [
  "coverage",
  "Cython",
  "llvm",
  "pytest",
  "pytest-cov",
  "scipy",
  "tomli"
]
docs = [
  "Cython",
  "cupy",
  "furo",
  "numpydoc",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
  "pyenchant",
  "sphinxcontrib-googleanalytics",
  "sphinxcontrib-spelling"
]
test = ["pytest", "scipy"]

[project.urls]
Changelog = "https://github.com/IntelPython/dpnp/blob/master/CHANGELOG.md"
Documentation = "https://intelpython.github.io/dpnp"
Homepage = "https://github.com/IntelPython/dpnp"
Issues = "https://github.com/IntelPython/dpnp/issues"
Repository = "https://github.com/IntelPython/dpnp.git"

[tool.black]
line-length = 80
target-version = ['py310', 'py311', 'py312', 'py313', 'py314', 'py315']

[tool.cibuildwheel]
build-verbosity = 1

[tool.cibuildwheel.linux]
# Intel's icpx, from Intel's repository, and oneMKL, oneDPL and oneTBB from conda-forge;
# dpctl's wheel, imported at build time, needs a libstdc++ newer than the image's
before-all = [
  "git config --global --add safe.directory '*'",
  "rpm --import https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB",
  "printf '[oneAPI]\\nname=Intel oneAPI\\nbaseurl=https://yum.repos.intel.com/oneapi\\nenabled=1\\ngpgcheck=1\\nrepo_gpgcheck=1\\ngpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB\\n' > /etc/yum.repos.d/oneAPI.repo",
  "dnf install -y intel-oneapi-compiler-dpcpp-cpp-2026.2",
  "curl -fsSL -o /usr/local/bin/micromamba https://github.com/mamba-org/micromamba-releases/releases/download/2.10.0-0/micromamba-linux-64",
  "echo '701f39c06f8e6a670a0e186c8479b9e5c0502a2f0cda6cef65d83bdd2875e8bd  /usr/local/bin/micromamba' | sha256sum -c -",
  "chmod +x /usr/local/bin/micromamba",
  "micromamba create -y -r /tmp/micromamba -p /opt/sdk --override-channels -c conda-forge 'mkl-devel-dpcpp>=2026.0,<2027' onedpl-devel tbb-devel",
  "mkdir /opt/stdcxx && cp -a /opt/sdk/lib/libstdc++.so.6* /opt/stdcxx/"
]
environment = { LD_LIBRARY_PATH = "/opt/stdcxx", CPATH = "/opt/sdk/include", CC = "/opt/intel/oneapi/compiler/2026.2/bin/icx", CXX = "/opt/intel/oneapi/compiler/2026.2/bin/icpx", CMAKE_GENERATOR = "Ninja", CMAKE_ARGS = "-DDPNP_WITH_REDIST:BOOL=ON", CMAKE_BUILD_PARALLEL_LEVEL = "4", CMAKE_PREFIX_PATH = "/opt/sdk", MKLROOT = "/opt/sdk" }
# The SYCL runtime, oneMKL and the compiler's libraries come from wheels at run time, see [tool.gh-ci].
# libstdc++ is as new as dpctl's wheel needs, which auditwheel's policy refuses, so the tag is set here.
repair-wheel-command = "python -m pip install -q wheel && python -m wheel tags --remove --platform-tag manylinux_2_28_x86_64 {wheel} && mv \"$(dirname {wheel})\"/*-manylinux_2_28_x86_64.whl {dest_dir}"

[tool.cibuildwheel.windows]
# Intel's icx, and oneMKL, oneDPL and oneTBB, from conda-forge; DLLs come from wheels at run time, see [tool.gh-ci]
before-all = "python {project}/ci/install_icx.py C:/sdk"
environment = { CC = "C:/sdk/Library/bin/icx.exe", CXX = "C:/sdk/Library/bin/icx.exe", CMAKE_GENERATOR = "Ninja", CMAKE_ARGS = "-DCMAKE_INTERPROCEDURAL_OPTIMIZATION:BOOL=FALSE", CMAKE_BUILD_PARALLEL_LEVEL = "4", CMAKE_PREFIX_PATH = "C:/sdk/Library", MKLROOT = "C:/sdk/Library", TBB_ROOT_HINT = "C:/sdk/Library", DPL_ROOT_HINT = "C:/sdk/Library", LIB = "C:/sdk/Library/lib;$LIB", INCLUDE = "C:/sdk/Library/include;$INCLUDE", PATH = "C:/sdk/Library/bin;$PATH" }
# The DLLs come from wheels at run time, so there is nothing to bundle
repair-wheel-command = ""

[tool.codespell]
builtin = "clear,rare,informal,names"
check-filenames = true
ignore-words-list = "amin,arange,elemt,fro,hist,ith,mone,nd,nin,sinc,vart,GroupT,AccessorT,IndexT,fpT,OffsetT,inpT, wit"
quiet-level = 3

[tool.coverage.report]
omit = [
  "dpnp/tests/*",
  "dpnp/_version.py"
]

[tool.coverage.run]
branch = true
# Pin the C trace core. On Python 3.14+ coverage.py defaults to the sys.monitoring
# ("sysmon") core, which (1) does not support plugins such as Cython.Coverage below,
# and (2) corrupts the exception state when a C/Cython function raises, turning
# expected exceptions into SystemError (e.g. usm_ndarray.__dlpack__ in test_dlpack.py).
core = "ctrace"
omit = [
  "dpnp/tests/*",
  "dpnp/_version.py"
]
plugins = [
  "Cython.Coverage"
]
source = [
  "dpnp"
]

[tool.cython-lint]
max-line-length = 80

[tool.gh-ci]
# What the wheels need at run time, which conda packages get from the recipe
wheel-requires = [
  "dpcpp-cpp-rt >=2026.2,<2027",
  "intel-cmplr-lib-rt >=2026.2,<2027",
  "intel-sycl-rt >=2026.2,<2027",
  "mkl >=2026.2,<2027",
  "onemkl-sycl-blas >=2026.2,<2027",
  "onemkl-sycl-dft >=2026.2,<2027",
  "onemkl-sycl-lapack >=2026.2,<2027",
  "onemkl-sycl-rng >=2026.2,<2027",
  "onemkl-sycl-sparse >=2026.2,<2027",
  "onemkl-sycl-vm >=2026.2,<2027"
]

[tool.isort]
ensure_newline_before_comments = true
force_grid_wrap = 0
include_trailing_comma = true
known_third_party = ["dpctl"]
line_length = 80
multi_line_output = 3
profile = "black"
skip = ["dpnp/__init__.py"]
split_on_trailing_comma = true
use_parentheses = true

[tool.pylint.basic]
disable = [
  "wrong-import-order",
  "ungrouped-imports",
  "wrong-import-position"
]
ignored-modules = ["dpctl", "dpctl.*"]
include-naming-hint = true

[tool.pylint.classes]
exclude-protected = ["_create_from_usm_ndarray"]

[tool.pylint.design]
max-args = 11
max-branches = 18
max-locals = 30
max-positional-arguments = 9
max-returns = 8

[tool.pylint.format]
max-line-length = 80
max-module-lines = 8000

[tool.pylint.imports]
allow-wildcard-with-all = true

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX"]

[tool.pylint.typecheck]
extension-pkg-allow-list = ["numpy"]
generated-members = ["numpy.*", "finfo.*", "iinfo.*"]

[tool.versioneer]
VCS = "git"
parentdir_prefix = "dpnp-"
style = "pep440"
versionfile_build = "dpnp/_version.py"
versionfile_source = "dpnp/_version.py"

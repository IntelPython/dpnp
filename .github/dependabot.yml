version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/environments"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Bumped by hand: the floor tracks the dpctl dev series (X.Y.0dev0)
      - dependency-name: "dpctl"

  # Handles plain conda-forge "pkg=X.Y.Z" pins and pip: sections
  - package-ecosystem: "conda"
    directory: "/environments"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      conda:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      pre-commit:
        patterns: ["*"]

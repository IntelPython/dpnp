version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      github-actions:
        patterns: ["*"]

  # A dpctl release makes this raise the dpctl floor in dpctl_pkg.txt only: don't
  # merge that PR; bump the dev pins to the next dev series and the release-only
  # pins (build-system, conda-recipe-cf) to the new release by hand (see .github/AGENTS.md)
  - package-ecosystem: "pip"
    directory: "/environments"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      pip:
        patterns: ["*"]

  # Handles plain conda-forge "pkg=X.Y.Z" pins and pip: sections
  - package-ecosystem: "conda"
    directory: "/environments"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      conda:
        patterns: ["*"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    cooldown:
      default-days: 7
    rebase-strategy: "disabled"
    labels: ["autoupdate"]
    groups:
      pre-commit:
        patterns: ["*"]

name: Conda package (conda-forge)

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# Cancel superseded PR runs only; other runs get a unique group and always complete
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: linux
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: ubuntu-latest
      conda-subdir: linux-64
      channels-list: '-c conda-forge --override-channels'
      recipe-dir: conda-recipe-cf

  windows:
    name: windows
    uses: ./.github/workflows/conda-build-test.yml
    with:
      runs-on: windows-2022
      conda-subdir: win-64
      channels-list: '-c conda-forge --override-channels'
      recipe-dir: conda-recipe-cf

name: Run tests suite
on:
  # To be able to be triggered manually
  workflow_dispatch:
  # Nightly test of the dpnp package of the latest tag
  schedule:
    - cron: '28 2 * * *'

permissions: read-all

env:
  # Pinned: Miniforge3 26.9.4-0 fails 'conda init' on Windows runners
  miniforge-version: '26.7.2-1'
  package-name: dpnp
  channels-list: '-c dppy/label/dev -c https://software.repos.intel.com/python/conda/ -c conda-forge --override-channels'
  test-env-name: test
  test-packages: 'pytest scipy'
  rerun-tests-max-attempts: 2
  rerun-tests-timeout: 20

jobs:
  test:
    name: Test

    # disable scheduled workflow to be run in forks
    if: github.event.repository.fork == false

    runs-on:  ${{ matrix.runner }}
    timeout-minutes: 60

    defaults:
      run:
        shell: ${{ matrix.runner == 'windows-2022' && 'cmd /C CALL {0}' || 'bash -el {0}' }}

    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        runner: [ubuntu-latest, windows-2022]
        include:
          - python: '3.14'
            runner: ubuntu-latest
            python_spec: '3.14.* *_cp314'
          - python: '3.14'
            runner: windows-2022
            python_spec: '3.14.* *_cp314'
          - python: '3.14'
            runner: ubuntu-latest
            python_spec: '3.14.* *_cp314t'
          - python: '3.14'
            runner: windows-2022
            python_spec: '3.14.* *_cp314t'
          - python: '3.15'
            runner: ubuntu-latest
            python_spec: '3.15.* *_cp315'
          - python: '3.15'
            runner: windows-2022
            python_spec: '3.15.* *_cp315'
          # TODO: add free-threaded builds ('3.15.* *_cp315t') once NumPy and
          # dpctl cp315t builds are available

    env:
      python-install-spec: "python ${{ matrix.python_spec || format('{0}.*', matrix.python) }}"

    steps:
      - name: Find the latest tag
        id: find_latest_tag
        uses: oprypin/find-latest-tag@6957ac556fa6d349727ecabfcaaf9f8e5ee37124 # v1.1.3
        with:
          repository: IntelPython/dpnp
          releases-only: false

      - name: Print latest tag
        run: |
          echo "Latest tag is ${{ steps.find_latest_tag.outputs.tag }}"

      # Only for the local setup-miniconda action; the tests run from the installed package
      - name: Checkout DPNP repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: Setup miniconda
        uses: ./.github/actions/setup-miniconda
        with:
          miniforge-version: ${{ env.miniforge-version }}
          python-version: ${{ matrix.python }}
          channels: conda-forge
          activate-environment: ${{ env.test-env-name }}

      - name: Install OCL CPU RT from Intel channel
        run: mamba install intel-opencl-rt=*=intel_* ${{ env.channels-list }}

      - name: Install dpnp
        id: install_dpnp
        continue-on-error: true
        run: |
          mamba install ${{ env.package-name }}=${{ steps.find_latest_tag.outputs.tag }} ${{ env.test-packages }} "${{ env.python-install-spec }}" ${{ env.channels-list }}

      - name: ReInstall dpnp
        if: steps.install_dpnp.outcome == 'failure'
        run: |
          mamba install ${{ env.package-name }}=${{ steps.find_latest_tag.outputs.tag }} ${{ env.test-packages }} "${{ env.python-install-spec }}" ${{ env.channels-list }}

      - name: List installed packages
        run: mamba list

      - name: Activate OCL CPU RT
        if: matrix.runner == 'windows-2022'
        shell: pwsh
        run: |
          $script_path="$env:CONDA_PREFIX\Scripts\set-intel-ocl-icd-registry.ps1"
          if (Test-Path $script_path) {
            &$script_path
          } else {
            Write-Warning "File $script_path was NOT found!"
          }
          # Check the variable assisting OpenCL CPU driver to find TBB DLLs which are not located where it expects them by default
          $cl_cfg="$env:CONDA_PREFIX\Library\bin\cl.cfg"
          Get-Content -Tail 5 -Path $cl_cfg

      - name: Smoke test
        run: |
          python -m dpctl -f
          python -c "import dpnp; print(dpnp.__version__)"

      - name: Run tests
        id: run_tests
        continue-on-error: true
        run: |
          python -m pytest -ra --pyargs ${{ env.package-name }}.tests
        env:
          SYCL_CACHE_PERSISTENT: 1

      - name: ReRun tests on Linux
        if: steps.run_tests.outcome == 'failure' && matrix.runner != 'windows-2022'
        id: run_tests_linux
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: ${{ env.rerun-tests-timeout }}
          max_attempts: ${{ env.rerun-tests-max-attempts }}
          retry_on: any
          command: |
            . $CONDA/etc/profile.d/conda.sh
            . $CONDA/etc/profile.d/mamba.sh
            mamba activate ${{ env.test-env-name }}

            python -m pytest -ra --pyargs ${{ env.package-name }}.tests
        env:
          SYCL_CACHE_PERSISTENT: 1

      - name: ReRun tests on Windows
        if: steps.run_tests.outcome == 'failure' && matrix.runner == 'windows-2022'
        id: run_tests_win
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: ${{ env.rerun-tests-timeout }}
          max_attempts: ${{ env.rerun-tests-max-attempts }}
          retry_on: any
          command: |
            python -m pytest -ra --pyargs ${{ env.package-name }}.tests
        env:
          SYCL_CACHE_PERSISTENT: 1

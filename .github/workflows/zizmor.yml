name: Security scan of GitHub Actions workflows (zizmor)

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Scan GitHub Actions workflows

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # needed to clone the repo

    steps:
      - name: Checkout DPNP repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Low/informational template-injection notes come from internally-defined
          # values (no external input), so they are reported as annotations but do not gate CI
          min-severity: medium
          advanced-security: false
          annotations: true
          inputs: .github/

name: Security scan of GitHub Actions workflows (zizmor)

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

# Cancel superseded PR runs only; other runs get a unique group and always complete
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Scan GitHub Actions workflows

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read # needed to clone the repo

    steps:
      - name: Checkout DPNP repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Low/informational template-injection notes come from internally-defined
          # values (no external input), so they are reported as annotations but do not gate CI
          min-severity: medium
          advanced-security: false
          annotations: true
          inputs: .github/

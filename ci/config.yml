# Intel Python CI (gh-ci) settings for dpnp, see ci/README.md
version: 1
workflow: intel-ci.yml
artifacts:
  conda: "dpnp {platform} Python {python}"
  wheel: "dpnp {platform} Wheels Python {python}"
test:
  requires: [pytest, pytest-xdist, scipy]
  # The wheels' requirements have no OpenCL CPU runtime of their own, which the tests need
  wheel_requires: [pytest, pytest-xdist, scipy, intel-opencl-rt]
benchmark:
  # PyYAML, which asv needs, has no PyPI wheel for every Python the recipe declares.
  requires: [scipy, pyyaml]
  # conda-forge lacks asv for some Python the recipe declares; the wheel on PyPI fits all.
  pip_requires: [asv]
